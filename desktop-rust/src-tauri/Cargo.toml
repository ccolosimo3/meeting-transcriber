[package]
name = "meeting-transcriber-reader"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.4", features = ["std"] }
tauri = { version = "=2.12.5", features = [] }
tokio = { version = "1", features = ["net", "rt", "time"] }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tauri-plugin-dialog = { version = "2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[dev-dependencies]
tempfile = "3"
